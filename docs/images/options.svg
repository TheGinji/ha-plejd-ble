<title id="t">Plejd BLE options: choosing the Bluetooth connection points</title><desc id="d">The options dialog twice. Just after connecting, the device you are connected through shows a link symbol, a green dot and its signal strength. After fifteen minutes it shows the link symbol and a dash, because it sends no signal data while the connection is open.</desc>
