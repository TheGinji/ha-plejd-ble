name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  tests:
    name: Tests en dekking
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v7

      - name: Python instellen
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Testafhankelijkheden installeren
        run: pip install -r requirements_test.txt

      - name: Bluetooth-onderdelen van Home Assistant installeren
        run: |
          python - <<'PY' > bluetooth-requirements.txt
          import json
          from pathlib import Path

          import homeassistant

          base = Path(homeassistant.__file__).parent / "components"
          for name in ("bluetooth", "bluetooth_adapters", "usb"):
              manifest = json.loads((base / name / "manifest.json").read_text())
              for requirement in manifest.get("requirements", []):
                  print(requirement)
          PY
          pip install -r bluetooth-requirements.txt

      - name: Tests draaien
        run: pytest --cov-fail-under=95

  tests-versies:
    name: "Tests op Home Assistant (${{ matrix.naam }})"
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimenteel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - naam: oudste ondersteunde versie
            installeren: 'pip install -r requirements_test.txt "homeassistant>=2026.10,<2026.11"'
            experimenteel: false
          - naam: komende bètaversie
            installeren: "pip install --pre -r requirements_test.txt"
            experimenteel: true
    steps:
      - name: Code ophalen
        uses: actions/checkout@v7

      - name: Python instellen
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Testafhankelijkheden installeren
        run: ${{ matrix.installeren }}

      - name: Bluetooth-onderdelen van Home Assistant installeren
        run: |
          python - <<'PY' > bluetooth-requirements.txt
          import json
          from pathlib import Path

          import homeassistant

          base = Path(homeassistant.__file__).parent / "components"
          for name in ("bluetooth", "bluetooth_adapters", "usb"):
              manifest = json.loads((base / name / "manifest.json").read_text())
              for requirement in manifest.get("requirements", []):
                  print(requirement)
          PY
          pip install -r bluetooth-requirements.txt

      - name: Home Assistant-versie tonen
        run: python -c "import homeassistant.const as c; print(c.__version__)"

      - name: Tests draaien
        run: pytest
