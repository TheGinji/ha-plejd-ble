# Our own assessment against the Home Assistant Integration Quality Scale.
# Custom integrations are not scored by Home Assistant. This file is not checked
# by Hassfest for custom integrations, it only records where we stand.
# See https://www.home-assistant.io/docs/quality_scale/
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration has no service actions of its own.
  appropriate-polling:
    status: done
    comment: >-
      Updates are pushed over Bluetooth. The only periodic work is a keep-alive,
      a clock check once an hour and a local refresh of signal data once a
      minute. None of these call the Plejd cloud.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: todo
    comment: >-
      The tests cover the config flow, but the coverage of config_flow.py is not
      measured separately. The workflow only requires 95% for the whole
      integration, and this rule asks for 100% of the config flow.
  dependency-transparency:
    status: todo
    comment: >-
      The pyplejd package on PyPI cannot be traced to its public repository. The
      repository has no tag for the published version, and the package lacks a
      relay fix that is merged in the repository. Only the maintainer of pyplejd
      can solve this.
  docs-actions:
    status: exempt
    comment: The integration has no service actions of its own.
  docs-conditions:
    status: exempt
    comment: The integration has no conditions of its own.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration has no triggers of its own.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: The workflow fails when coverage of the whole integration drops below 95%.

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info:
    status: exempt
    comment: >-
      Bluetooth discovery only starts the setup. No address or other connection
      detail is stored from it. The mesh is reached through the Home Assistant
      Bluetooth stack, and the keys come from the Plejd cloud.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: todo
    comment: >-
      A device added in the Plejd app appears after Refresh device list or a
      reload, not by itself. This is deliberate, to limit the use of the Plejd
      cloud.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession:
    status: todo
    comment: >-
      pyplejd makes its own web session for the Plejd cloud and does not accept
      the one from Home Assistant.
  strict-typing:
    status: todo
    comment: >-
      There is no strict type checking in the workflow yet, and pyplejd does not
      ship type information.
